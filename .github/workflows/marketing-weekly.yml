name: Weekly marketing review pack

on:
  schedule:
    # Monday 09:17 JST (00:17 UTC), avoiding the top-of-hour rush.
    - cron: '17 0 * * 1'
  workflow_dispatch:
    inputs:
      reset_baseline:
        description: '前回成果物の失効・履歴変更時のみ基準点を再作成（新機能告知なし）'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: marketing-weekly
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/marketing/package-lock.json
      - run: npm ci --prefix tools/marketing --ignore-scripts
      - run: npm test --prefix tools/marketing
      - name: Find previous successful baseline
        id: previous
        uses: actions/github-script@v7
        env:
          RESET_BASELINE: ${{ inputs.reset_baseline || 'false' }}
        with:
          script: |
            const findPrevious = require('./tools/marketing/previous-run.cjs');
            await findPrevious({ github, context, core });
      - name: Restore previous review artifact
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: marketing-review
          path: marketing-previous
          github-token: ${{ github.token }}
          run-id: ${{ steps.previous.outputs.run_id }}
      - name: Generate review drafts
        env:
          PREVIOUS_RUN: ${{ steps.previous.outputs.run_id }}
        run: |
          if [ -n "$PREVIOUS_RUN" ]; then
            node tools/marketing/generate.mjs --previous-state marketing-previous/state.json
          else
            node tools/marketing/generate.mjs
          fi
      # A run becomes a checkpoint only after generation AND artifact upload succeed.
      - name: Save review pack and next checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: marketing-review
          path: marketing-output/
          retention-days: 90
          if-no-files-found: error
